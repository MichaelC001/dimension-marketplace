[project]
name = "dim-browser-bridge"
version = "0.1.0"
description = "MCP stdio bridge exposing jev and browser-use as per-action-approved browser drivers."
license = "MIT"
# jev-ultrafast requires >=3.12; browser-use requires >=3.11,<4.
requires-python = ">=3.12,<4"
dependencies = [
  # The MCP Python SDK version both upstreams pin, so one environment holds
  # browser-harness[mcp], browser-use and this server without a conflict.
  "mcp==2.1.1",
  "browser-use==0.13.10",
  # Direct dependency of both engines; pinned here so the resolution is visible.
  "browser-harness==0.1.13",
  # jev-ultrafast is not published to PyPI (pypi.org/pypi/jev-ultrafast/json is
  # 404), so it is pinned to the exact upstream commit. No vendoring, no fork.
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# jev-ultrafast is a direct (git) reference; hatchling refuses those unless the
# project opts in explicitly.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["dim_browser_bridge"]
