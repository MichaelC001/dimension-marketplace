# Rendered by the gmail plugin's connect flow (Plugin UI Contract, doc 35).
# Placeholders ${email} / ${appPassword} are substituted from the connect form,
# then written to ~/.config/himalaya/config.toml. The App Password is stored raw
# in this user-owned file (himalaya's simplest form-auth); a keyring/cmd variant
# is documented in skills/gmail/references/configuration.md.
[accounts.gmail]
email = "${email}"
display-name = "${email}"
default = true

backend.type = "imap"
backend.host = "imap.gmail.com"
backend.port = 993
backend.encryption.type = "tls"
backend.login = "${email}"
backend.auth.type = "password"
backend.auth.raw = "${appPassword}"

message.send.backend.type = "smtp"
message.send.backend.host = "smtp.gmail.com"
message.send.backend.port = 587
message.send.backend.encryption.type = "start-tls"
message.send.backend.login = "${email}"
message.send.backend.auth.type = "password"
message.send.backend.auth.raw = "${appPassword}"
