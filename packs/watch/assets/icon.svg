<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="watch — an aperture built from film frames">
  <title>watch</title>
  <!-- Every paint is `var(–fr-accent, #b78cff)`: inside Fraym the icon retints
       automatically when the user switches accent palette (violet, coral, blue,
       green, amber), because that is the same token the rest of the system reads.
       DESIGN.md reserves the accent as the single identity colour and requires
       tokens over literals, so never hardcode a hue in the shapes.

       The #b78cff literal is only the fallback for STANDALONE use – an SVG
       loaded via an img tag or opened as a file is an isolated document with no
       Fraym tokens defined, where an unqualified currentColor resolves to black.
       (A root color="" attribute would have fixed that too, but presentation
       attributes beat inherited CSS, which silently breaks accent switching.) -->
  <defs>
    <radialGradient id="watch-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--fr-accent, #b78cff)" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="var(--fr-accent, #b78cff)" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="var(--fr-accent, #b78cff)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Inner glow: the "live" wash, kept faint per the flat/tonal rule. -->
  <circle cx="32" cy="32" r="16" fill="url(#watch-iris)"/>

  <!-- Rim: twelve film frames, one per sampled moment. Opacity falls away from
       the top frame so the ring reads as a timeline with a head, not a wheel. -->
  <g fill="var(--fr-accent, #b78cff)">
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(0 32 32) translate(32 6.5)" opacity="1.00"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(30 32 32) translate(32 6.5)" opacity="0.88"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(60 32 32) translate(32 6.5)" opacity="0.77"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(90 32 32) translate(32 6.5)" opacity="0.65"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(120 32 32) translate(32 6.5)" opacity="0.53"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(150 32 32) translate(32 6.5)" opacity="0.42"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(180 32 32) translate(32 6.5)" opacity="0.30"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(210 32 32) translate(32 6.5)" opacity="0.42"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(240 32 32) translate(32 6.5)" opacity="0.53"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(270 32 32) translate(32 6.5)" opacity="0.65"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(300 32 32) translate(32 6.5)" opacity="0.77"/>
    <rect x="-3.1" y="-2.2" width="6.2" height="4.4" rx="1" transform="rotate(330 32 32) translate(32 6.5)" opacity="0.88"/>
  </g>

  <!-- Aperture blades: six chords stepping in opacity, so the iris reads as
       physically stacked leaves rather than a flat hexagon. -->
  <g fill="var(--fr-accent, #b78cff)">
    <path d="M32.00 18.50 L43.69 25.25 Q34.46 27.75 32.00 18.50 Z" opacity="0.22"/>
    <path d="M43.69 25.25 L43.69 38.75 Q36.91 32.00 43.69 25.25 Z" opacity="0.32"/>
    <path d="M43.69 38.75 L32.00 45.50 Q34.46 36.25 43.69 38.75 Z" opacity="0.42"/>
    <path d="M32.00 45.50 L20.31 38.75 Q29.54 36.25 32.00 45.50 Z" opacity="0.52"/>
    <path d="M20.31 38.75 L20.31 25.25 Q27.09 32.00 20.31 38.75 Z" opacity="0.62"/>
    <path d="M20.31 25.25 L32.00 18.50 Q29.54 27.75 20.31 25.25 Z" opacity="0.72"/>
  </g>

  <!-- Aperture edge + pupil: the hairline the whole mark hangs off. -->
  <path d="M32 18.5 L43.69 25.25 L43.69 38.75 L32 45.5 L20.31 38.75 L20.31 25.25 Z"
        fill="none" stroke="var(--fr-accent, #b78cff)" stroke-width="1.1" stroke-linejoin="round" opacity="0.9"/>
  <circle cx="32" cy="32" r="3.1" fill="var(--fr-accent, #b78cff)"/>
</svg>
