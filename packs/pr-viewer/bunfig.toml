# This pack's tests render its components, and its components import the kit —
# whose source carries Vite-only `?url` asset imports and a PDF worker. The kit
# already owns adapters that keep those imports loadable under Bun; a pack run
# does not inherit the kit's own preloads, so it names them here.
[test]
preload = [
	"../../../fraym/packages/ui/test/test-globals.ts",
	"../../../fraym/packages/ui/test/pdfjs-test-adapter.ts",
	"../../../fraym/packages/ui/test/asset-url-test-adapter.ts",
]
telemetry = false
